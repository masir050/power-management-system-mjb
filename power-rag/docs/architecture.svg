<svg width="100%" viewBox="0 0 680 576" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>电力故障研判助手架构图</title>
<desc>两条独立链路：离线把 15 份规程切块向量化入 pgvector；在线由四个入口经 ChatClient 编排，调用检索层与工具层，读写四类存储，并由两家模型提供服务。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="40" y="40" width="600" height="96" rx="12" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="62" font-size="12" font-weight="500" fill="#444441">离线灌库 · 上线前跑一次</text>

<rect x="56" y="72" width="124" height="52" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="118" y="94" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">15 份规程 md</text>
<text x="118" y="112" font-size="11" fill="#5F5E5A" text-anchor="middle">data/docs</text>

<rect x="204" y="72" width="124" height="52" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="266" y="94" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">按小节切块</text>
<text x="266" y="112" font-size="11" fill="#5F5E5A" text-anchor="middle">180 块 · 每份 12 节</text>

<rect x="352" y="72" width="124" height="52" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="414" y="94" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">bge-m3 向量化</text>
<text x="414" y="112" font-size="11" fill="#5F5E5A" text-anchor="middle">1024 维</text>

<rect x="500" y="72" width="124" height="52" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="562" y="94" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">pgvector</text>
<text x="562" y="112" font-size="11" fill="#5F5E5A" text-anchor="middle">vector_store 表</text>

<line x1="180" y1="98" x2="200" y2="98" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="328" y1="98" x2="348" y2="98" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="476" y1="98" x2="496" y2="98" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="156" width="600" height="400" rx="12" fill="none" stroke="#B5D4F4" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="56" y="176" font-size="12" font-weight="500" fill="#185FA5">在线问答 · 每次请求</text>

<rect x="56" y="186" width="130" height="40" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="121" y="211" font-size="11" font-weight="500" fill="#185FA5" text-anchor="middle" font-family="Consolas, monospace">/ask</text>
<rect x="200" y="186" width="130" height="40" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="265" y="211" font-size="11" font-weight="500" fill="#185FA5" text-anchor="middle" font-family="Consolas, monospace">/agent</text>
<rect x="344" y="186" width="130" height="40" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="409" y="211" font-size="11" font-weight="500" fill="#185FA5" text-anchor="middle" font-family="Consolas, monospace">/diagnose</text>
<rect x="488" y="186" width="130" height="40" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="553" y="211" font-size="11" font-weight="500" fill="#185FA5" text-anchor="middle" font-family="Consolas, monospace">/chat/stream</text>

<line x1="337" y1="226" x2="337" y2="244" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="56" y="248" width="562" height="52" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="76" y="270" font-size="13" font-weight="500" fill="#042C53">ChatClient 编排</text>
<text x="76" y="288" font-size="11" fill="#0C447C">工具轮次 ≤ 6 · Trace 逐步记录 · 主模型失败自动切备胎</text>

<line x1="337" y1="300" x2="337" y2="318" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="56" y="322" width="270" height="68" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="76" y="344" font-size="13" font-weight="500" fill="#04342C">检索层</text>
<text x="76" y="364" font-size="11" fill="#0F6E56">向量 pgvector ｜ BM25</text>
<text x="76" y="381" font-size="11" fill="#0F6E56">RRF k=60 → rerank 精排 → 拒答闸门</text>

<rect x="348" y="322" width="270" height="68" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="368" y="344" font-size="13" font-weight="500" fill="#04342C">工具层</text>
<text x="368" y="364" font-size="11" fill="#0F6E56">queryDevice · queryAlarms</text>
<text x="368" y="381" font-size="11" fill="#0F6E56">queryMaintenance · downstream</text>

<line x1="191" y1="390" x2="191" y2="408" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="483" y1="390" x2="483" y2="408" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="56" y="412" width="130" height="52" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="121" y="434" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">MySQL</text>
<text x="121" y="451" font-size="11" fill="#5F5E5A" text-anchor="middle">台账·告警·检修</text>

<rect x="200" y="412" width="130" height="52" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="265" y="434" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">PostgreSQL</text>
<text x="265" y="451" font-size="11" fill="#5F5E5A" text-anchor="middle">pgvector 180 块</text>

<rect x="344" y="412" width="130" height="52" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="409" y="434" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">Neo4j</text>
<text x="409" y="451" font-size="11" fill="#5F5E5A" text-anchor="middle">6 设备 · 两跳拓扑</text>

<rect x="488" y="412" width="130" height="52" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="553" y="434" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle">Redis</text>
<text x="553" y="451" font-size="11" fill="#5F5E5A" text-anchor="middle">会话·答案缓存</text>

<line x1="337" y1="464" x2="337" y2="482" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="56" y="486" width="270" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="76" y="513" font-size="12" font-weight="500" fill="#2C2C2A">DeepSeek　主模型（对话）</text>

<rect x="348" y="486" width="270" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="368" y="513" font-size="12" font-weight="500" fill="#2C2C2A">硅基流动　embedding + rerank + 备胎</text>
</svg>
