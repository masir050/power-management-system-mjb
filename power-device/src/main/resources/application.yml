server:
  port: 8082

spring:
  application:
    name: power-device
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本服务只连自己的库；跨服务取数一律走 Feign，不在 SQL 里跨库 join
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/power_device?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  # ===== 缓存：Cache Aside 的数据源，也是网关限流令牌桶的存储 =====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yaml
        import-check:
          enabled: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  # Mapper XML 里使用简名（resultType="PowerEquipment"），需注册包扫描才能解析。
  # 漏了这行启动即抛 "Could not resolve type alias"，但编译期不报错。
  type-aliases-package: com.power.device.pojo
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL；生产改为 org.apache.ibatis.logging.nologging.NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

power:
  jwt:
    secret: ${JWT_SECRET:power-management-jwt-secret-key-2026-please-change-in-prod}
    expire-minutes: 1440
  # ===== 缓存与分布式锁：开启后才装配 CacheTemplate / DistributedLock / RedissonClient =====
  cache:
    enabled: true
  redis:
    # 开启才会创建 RedissonClient；auth/billing 等无锁需求的服务保持默认关闭
    enabled: true
    address: redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
    database: 0
    password: ${REDIS_PASSWORD:}
    # 看门狗超时：业务执行超过该时长且未续期成功时锁才自动释放。
    # 不配 leaseTime 调 lock() 时，Redisson 每（该值/3）续期一次。
    watchdog-timeout-ms: 30000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.power.device: DEBUG
